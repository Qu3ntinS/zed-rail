name: zedrail-release

on:
  push:
    tags:
      - "v*-rail*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.16.1-rail.4)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build_linux_x64:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install dependencies
        run: |
          ./script/linux
          sudo apt-get install -y clang-18
      - name: Bundle Linux
        run: ./script/bundle-linux
      - name: Stage artifacts
        run: |
          mkdir -p staging
          cp target/release/zedrail-linux-x86_64.tar.gz staging/
          cp target/zedrail-remote-server-linux-x86_64.gz staging/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: staging/*

  build_linux_arm:
    runs-on: ubuntu-24.04-arm
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install dependencies
        run: ./script/linux
      - name: Bundle Linux
        run: ./script/bundle-linux
      - name: Stage artifacts
        run: |
          mkdir -p staging
          cp target/release/zedrail-linux-aarch64.tar.gz staging/
          cp target/zedrail-remote-server-linux-aarch64.gz staging/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: staging/*

  build_windows:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Bundle Windows
        shell: pwsh
        run: ./script/bundle-windows.ps1
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item target/ZedRail-x86_64.exe staging/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: staging/*

  build_macos:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Bundle macOS (unsigned)
        run: ./script/bundle-mac
        env:
          ZED_BUNDLE: "true"
      - name: Stage artifacts
        run: |
          mkdir -p staging
          cp target/aarch64-apple-darwin/release/ZedRail-aarch64.dmg staging/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: staging/*

  publish:
    needs: [build_linux_x64, build_linux_arm, build_windows, build_macos]
    if: >-
      always() &&
      needs.build_linux_x64.result == 'success' &&
      needs.build_linux_arm.result == 'success' &&
      needs.build_windows.result == 'success' &&
      needs.build_macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          find artifacts -type f | sort

          assets=()
          required=(
            zedrail-linux-x86_64.tar.gz
            zedrail-remote-server-linux-x86_64.gz
            zedrail-linux-aarch64.tar.gz
            zedrail-remote-server-linux-aarch64.gz
          )
          for asset in "${required[@]}"; do
            path="$(find artifacts -type f -name "$asset" | head -1)"
            if [ -z "$path" ]; then
              echo "Missing required asset: $asset"
              exit 1
            fi
            assets+=("$path")
          done

          for optional in ZedRail-x86_64.exe ZedRail-aarch64.dmg; do
            path="$(find artifacts -type f -name "$optional" | head -1)"
            if [ -n "$path" ]; then
              assets+=("$path")
            fi
          done

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "ZedRail ${RELEASE_TAG}" \
              --notes "Install on Linux: \`curl -f https://raw.githubusercontent.com/${{ github.repository }}/zedrail/script/install-zedrail.sh | sh\`" \
              "${assets[@]}"
          fi
