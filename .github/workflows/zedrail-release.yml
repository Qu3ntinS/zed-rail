name: zedrail-release

on:
  push:
    tags:
      - "v*-rail*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build_linux_x64:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          ./script/linux
          sudo apt-get install -y clang-18
      - name: Bundle Linux
        run: ./script/bundle-linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/release/zedrail-linux-x86_64.tar.gz
            target/zedrail-remote-server-linux-x86_64.gz

  build_linux_arm:
    runs-on: ubuntu-24.04-arm
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: ./script/linux
      - name: Bundle Linux
        run: ./script/bundle-linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            target/release/zedrail-linux-aarch64.tar.gz
            target/zedrail-remote-server-linux-aarch64.gz

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bundle Windows
        shell: pwsh
        run: ./script/bundle-windows.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: target/release/ZedRail-x86_64.exe

  build_macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bundle macOS (unsigned)
        run: ./script/bundle-mac
        env:
          ZED_BUNDLE: "true"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: target/aarch64-apple-darwin/release/ZedRail-aarch64.dmg

  publish:
    needs: [build_linux_x64, build_linux_arm, build_windows, build_macos]
    if: >-
      always() &&
      needs.build_linux_x64.result == 'success' &&
      needs.build_linux_arm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "${{ github.ref_name }}"
            --title "ZedRail ${{ github.ref_name }}"
            --notes "Install on Linux: \`curl -f https://raw.githubusercontent.com/${{ github.repository }}/zedrail/script/install-zedrail.sh | sh\`"
          )
          for asset in \
            artifacts/linux-x86_64/zedrail-linux-x86_64.tar.gz \
            artifacts/linux-x86_64/zedrail-remote-server-linux-x86_64.gz \
            artifacts/linux-aarch64/zedrail-linux-aarch64.tar.gz \
            artifacts/linux-aarch64/zedrail-remote-server-linux-aarch64.gz
          do
            args+=("$asset")
          done
          if [ -f artifacts/windows-x86_64/ZedRail-x86_64.exe ]; then
            args+=(artifacts/windows-x86_64/ZedRail-x86_64.exe)
          fi
          if [ -f artifacts/macos-aarch64/ZedRail-aarch64.dmg ]; then
            args+=(artifacts/macos-aarch64/ZedRail-aarch64.dmg)
          fi
          gh release create "${args[@]}"
