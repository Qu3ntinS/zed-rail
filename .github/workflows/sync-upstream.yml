name: sync-upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zedrail
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch remotes
        run: |
          git remote add upstream https://github.com/zed-industries/zed.git || true
          git fetch origin main zedrail --tags
          git fetch upstream main --tags

      - name: Check for new upstream stable release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_upstream=$(gh release list --repo zed-industries/zed --limit 20 \
            --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease == false)] | first | .tagName')
          echo "latest_upstream=${latest_upstream}" >> "$GITHUB_OUTPUT"

          latest_zedrail=$(gh release list --repo "${{ github.repository }}" --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          echo "latest_zedrail=${latest_zedrail}" >> "$GITHUB_OUTPUT"

          upstream_version="${latest_upstream#v}"
          if [[ "${latest_zedrail}" == "v${upstream_version}-rail."* ]] || \
             [[ "${latest_zedrail}" == "v${upstream_version}-rail" ]]; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "Already synced to ${latest_upstream}"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
            echo "New upstream release: ${latest_upstream}"
          fi

      - name: Merge upstream into main
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          git checkout -B main origin/main
          git merge upstream/main --no-edit -m "Sync upstream ${UPSTREAM_TAG}"
        env:
          UPSTREAM_TAG: ${{ steps.check.outputs.latest_upstream }}

      - name: Merge main into zedrail
        if: steps.check.outputs.needs_sync == 'true'
        id: merge
        run: |
          git checkout -B zedrail origin/zedrail
          if ! git merge main --no-edit -m "Merge upstream ${UPSTREAM_TAG} into zedrail"; then
            echo "merge_failed=true" >> "$GITHUB_OUTPUT"
            git merge --abort
          else
            echo "merge_failed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          UPSTREAM_TAG: ${{ steps.check.outputs.latest_upstream }}

      - name: Report merge failure
        if: steps.check.outputs.needs_sync == 'true' && steps.merge.outputs.merge_failed == 'true'
        run: |
          echo "::error::Upstream sync failed while merging main into zedrail for ${UPSTREAM_TAG}. Resolve conflicts locally and push."
          exit 1

      - name: Tag and push release
        if: steps.check.outputs.needs_sync == 'true' && steps.merge.outputs.merge_failed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.check.outputs.latest_upstream }}
        run: |
          upstream_version="${UPSTREAM_TAG#v}"
          tag="v${upstream_version}-rail.1"
          git push origin main
          git push origin zedrail
          git tag "${tag}"
          git push origin "${tag}"
