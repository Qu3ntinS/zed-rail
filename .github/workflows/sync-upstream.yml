name: sync-upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zedrail
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch remotes
        run: |
          git remote add upstream https://github.com/zed-industries/zed.git || true
          git fetch origin main zedrail --tags
          git fetch upstream main --tags

      - name: Check if sync is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_sha=$(git rev-parse upstream/main)
          main_sha=$(git rev-parse origin/main)
          zedrail_sha=$(git rev-parse origin/zedrail)

          if git merge-base --is-ancestor "${upstream_sha}" "${main_sha}" && \
             git merge-base --is-ancestor "${main_sha}" "${zedrail_sha}"; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "Already synced: upstream/main is contained in main and zedrail"
            exit 0
          fi

          latest_upstream=$(gh release list --repo zed-industries/zed --limit 20 \
            --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease == false)] | first | .tagName')
          echo "latest_upstream=${latest_upstream}" >> "$GITHUB_OUTPUT"
          echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          echo "Sync required (main or zedrail behind upstream/main)"

      - name: Merge upstream into main
        if: steps.check.outputs.needs_sync == 'true'
        id: merge_main
        env:
          UPSTREAM_TAG: ${{ steps.check.outputs.latest_upstream }}
        run: |
          git checkout -B main origin/main
          before=$(git rev-parse HEAD)
          git merge upstream/main --no-edit -m "Sync upstream ${UPSTREAM_TAG}"
          after=$(git rev-parse HEAD)
          if [[ "${before}" == "${after}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge main into zedrail
        if: steps.check.outputs.needs_sync == 'true'
        id: merge_zedrail
        env:
          UPSTREAM_TAG: ${{ steps.check.outputs.latest_upstream }}
        run: |
          git checkout -B zedrail origin/zedrail
          before=$(git rev-parse HEAD)
          if ! git merge main --no-edit -m "Merge upstream ${UPSTREAM_TAG} into zedrail"; then
            echo "merge_failed=true" >> "$GITHUB_OUTPUT"
            git merge --abort
            exit 0
          fi
          after=$(git rev-parse HEAD)
          echo "merge_failed=false" >> "$GITHUB_OUTPUT"
          if [[ "${before}" == "${after}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge failure
        if: steps.check.outputs.needs_sync == 'true' && steps.merge_zedrail.outputs.merge_failed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.check.outputs.latest_upstream }}
        run: |
          echo "::error::Upstream sync failed while merging main into zedrail for ${UPSTREAM_TAG}. Resolve conflicts locally and push."
          exit 1

      - name: Push branches and tag release
        if: >-
          steps.check.outputs.needs_sync == 'true' &&
          steps.merge_zedrail.outputs.merge_failed != 'true' &&
          (steps.merge_main.outputs.changed == 'true' || steps.merge_zedrail.outputs.changed == 'true')
        env:
          UPSTREAM_TAG: ${{ steps.check.outputs.latest_upstream }}
        run: |
          upstream_version="${UPSTREAM_TAG#v}"
          prefix="v${upstream_version}-rail."

          max_patch=0
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            patch="${tag#"${prefix}"}"
            if [[ "${patch}" =~ ^[0-9]+$ ]] && (( patch > max_patch )); then
              max_patch=${patch}
            fi
          done < <(git tag -l "${prefix}*")

          tag="${prefix}$((max_patch + 1))"
          git push origin main
          git push origin zedrail
          git tag "${tag}"
          git push origin "${tag}"
          echo "Created tag ${tag}"
